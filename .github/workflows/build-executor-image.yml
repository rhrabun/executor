name: Build Executor Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-executor-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/host-selfhost/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/rhrabun/executor-selfhost:main
            ghcr.io/rhrabun/executor-selfhost:latest
            ghcr.io/rhrabun/executor-selfhost:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/rhrabun/executor
            org.opencontainers.image.revision=${{ github.sha }}